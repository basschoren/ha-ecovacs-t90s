target-version = "py314"
line-length = 88

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF", "BLE", "ASYNC", "C4", "PIE", "RET", "TRY", "LOG", "G", "SLF"]
ignore = ["E501", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "UP037", "TRY003", "TRY300", "TRY400", "PLC0415", "RUF012"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[lint.per-file-ignores]
# Upstream ECOVACS Live View protocol code, kept as close to v0.8.4 as possible
"**/live_view.py" = ["I001", "F401", "F811", "UP", "TRY004", "SIM", "ASYNC109", "RUF005", "BLE001", "B009", "B010", "RET", "C4", "PLW", "TRY", "PIE", "SLF001"]
"**/camera.py" = ["SIM105"]
"**/live_view_client.py" = ["TRY004"]
# Tests reach into internals on purpose
"tests/**" = ["SLF001"]

[format]
# Upstream ECOVACS Live View protocol code keeps its original formatting
exclude = ["**/live_view.py"]
